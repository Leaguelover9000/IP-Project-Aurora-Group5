<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dentists & Services - Aurora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main class="container">
    <h1>Our Dentists</h1>
    <p class="subtitle">Choose a dentist to see their available schedule.</p>
    <div id="msg"></div>
    <div class="grid" id="dentists"></div>

    <h1 style="margin-top:32px">Services</h1>
    <p class="subtitle">What we offer and how much it costs.</p>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Service</th><th>Duration</th><th>Price</th></tr></thead>
          <tbody id="services"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const user = initPage(['patient']);
    if (user) load().catch(showError);

    async function load() {
      const [dentists, services] = await Promise.all([api('GET', '/dentists'), api('GET', '/services')]);
      document.getElementById('dentists').innerHTML = dentists.map((d) => `
        <div class="card dentist-card">
          <h3>${esc(d.name)}</h3>
          <div class="spec">${esc(d.specialization)}</div>
          <p>${esc(d.email)}</p>
          ${d.phone ? `<p>${esc(d.phone)}</p>` : ''}
          <a class="btn btn-primary" href="book.html?dentist=${d.dentist_id}">View schedule &amp; book</a>
        </div>`).join('');
      document.getElementById('services').innerHTML = services.map((s) => `
        <tr><td>${esc(s.name)}</td><td>${s.duration_minutes} min</td><td>${peso(s.price)}</td></tr>`).join('');
    }
  </script>
</body>
</html>
