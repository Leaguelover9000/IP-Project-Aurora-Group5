<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Aurora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="brand"><span class="brand-mark">A</span>Aurora</div>

    <div class="card">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="showTab('login')">Log in</button>
        <button id="tab-register" onclick="showTab('register')">Create account</button>
      </div>
      <div id="msg"></div>

      <form id="login-form">
        <div class="field"><label>Email</label><input type="email" id="login-email" required></div>
        <div class="field"><label>Password</label><input type="password" id="login-password" required></div>
        <button class="btn btn-primary" style="width:100%">Log in</button>
      </form>

      <form id="register-form" hidden>
        <div class="field"><label>Full name</label><input id="reg-name" required></div>
        <div class="field"><label>Email</label><input type="email" id="reg-email" required></div>
        <div class="field"><label>Phone (optional)</label><input id="reg-phone"></div>
        <div class="field"><label>Password (at least 6 characters)</label><input type="password" id="reg-password" minlength="6" required></div>
        <button class="btn btn-primary" style="width:100%">Create patient account</button>
      </form>
    </div>

    <div class="card demo">
      <strong>Demo accounts</strong> (click to fill in the login form)<br>
      <button class="btn btn-sm" onclick="fill('patient@example.com','patient123')">Patient</button>
      <button class="btn btn-sm" onclick="fill('santos@clinic.com','dentist123')">Dentist</button>
      <button class="btn btn-sm" onclick="fill('admin@clinic.com','admin123')">Admin</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // already logged in? go to that role's home page
    const existing = getAuth();
    if (existing && existing.user && HOME[existing.user.role]) {
      location.href = HOME[existing.user.role];
    }

    function showTab(which) {
      document.getElementById('login-form').hidden = which !== 'login';
      document.getElementById('register-form').hidden = which !== 'register';
      document.getElementById('tab-login').classList.toggle('active', which === 'login');
      document.getElementById('tab-register').classList.toggle('active', which === 'register');
      document.getElementById('msg').innerHTML = '';
    }

    function fill(email, password) {
      showTab('login');
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await api('POST', '/auth/login', {
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-password').value,
        });
        setAuth(data);
        location.href = HOME[data.user.role];
      } catch (err) { showError(err); }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('POST', '/auth/register', {
          name: document.getElementById('reg-name').value,
          email: document.getElementById('reg-email').value,
          phone: document.getElementById('reg-phone').value,
          password: document.getElementById('reg-password').value,
        });
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        e.target.reset();
        fill(email, password);
        showMsg('Account created! Click "Log in" to continue.');
      } catch (err) { showError(err); }
    });
  </script>
</body>
</html>
