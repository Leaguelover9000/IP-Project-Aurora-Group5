<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Schedule - Aurora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main class="container">
    <h1>My Schedule</h1>
    <p class="subtitle">Add the times you are available. Patients can only book the slots you add here.</p>
    <div id="msg"></div>

    <div class="card">
      <h2>Add available slots</h2>
      <form id="slot-form" class="row">
        <div class="field"><label>Date</label><input type="date" id="date" required></div>
        <div class="field"><label>From</label><input type="time" id="start" value="09:00" required></div>
        <div class="field"><label>To</label><input type="time" id="end" value="12:00" required></div>
        <div class="field">
          <label>Slot length</label>
          <select id="length">
            <option value="30">30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60">1 hour</option>
            <option value="">One slot (whole range)</option>
          </select>
        </div>
        <button class="btn btn-primary">Add slots</button>
      </form>
      <p class="hint" style="margin:10px 0 0">Example: 09:00 to 12:00 with 30-minute slots creates 6 slots.</p>
    </div>

    <div class="card">
      <h2>My upcoming slots</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Time</th><th>Status</th><th>Patient</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>You have no upcoming slots. Add some above.</div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const user = initPage(['dentist']);
    const $ = (id) => document.getElementById(id);

    async function load() {
      const rows = await api('GET', '/schedules/me');
      $('empty').hidden = rows.length > 0;
      $('rows').innerHTML = rows.map((s) => `
        <tr>
          <td>${fmtDate(s.schedule_date)}</td>
          <td>${fmtRange(s.start_time, s.end_time)}</td>
          <td>${badge(s.status)}</td>
          <td>${s.patient_name ? esc(s.patient_name) : '-'}</td>
          <td class="actions">${s.status === 'Open'
            ? `<button class="btn btn-sm btn-danger" onclick="removeSlot(${s.schedule_id})">Remove</button>` : ''}</td>
        </tr>`).join('');
    }

    async function removeSlot(id) {
      try {
        await api('DELETE', `/schedules/${id}`);
        showMsg('Slot removed.');
        await load();
      } catch (err) { showError(err); }
    }

    if (user) {
      $('date').min = dateStr(0);
      $('date').value = dateStr(1);
      $('slot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const res = await api('POST', '/schedules', {
            schedule_date: $('date').value,
            start_time: $('start').value,
            end_time: $('end').value,
            slot_minutes: $('length').value || undefined,
          });
          showMsg(res.message);
          await load();
        } catch (err) { showError(err); }
      });
      load().catch(showError);
    }
  </script>
</body>
</html>
