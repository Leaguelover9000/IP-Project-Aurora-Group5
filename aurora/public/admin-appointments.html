<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Appointments - Aurora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main class="container">
    <h1>All Appointments</h1>
    <p class="subtitle">Every appointment in the clinic. You can confirm, complete or cancel them.</p>
    <div id="msg"></div>

    <div class="card">
      <div class="row" style="margin-bottom:14px">
        <div class="field" style="max-width:220px">
          <label>Show</label>
          <select id="filter">
            <option value="">All appointments</option>
            <option>Pending</option>
            <option>Confirmed</option>
            <option>Done</option>
            <option>Cancelled</option>
          </select>
        </div>
        <a class="btn btn-primary" href="book.html">+ Book for a patient</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Dentist</th><th>Service</th><th>Price</th><th>Status</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>No appointments to show.</div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const user = initPage(['admin']);
    const $ = (id) => document.getElementById(id);

    async function load() {
      const status = $('filter').value;
      const rows = await api('GET', '/appointments' + (status ? `?status=${status}` : ''));
      $('empty').hidden = rows.length > 0;
      $('rows').innerHTML = rows.map((a) => `
        <tr>
          <td>${fmtDate(a.schedule_date)}</td>
          <td>${fmtRange(a.start_time, a.end_time)}</td>
          <td>${esc(a.patient_name)}</td>
          <td>${esc(a.doctor_name)}</td>
          <td>${esc(a.service_name)}</td>
          <td>${peso(a.price)}</td>
          <td>${badge(a.status)}</td>
          <td class="actions">
            ${a.status === 'Pending' ? `<button class="btn btn-sm btn-primary" onclick="setStatus(${a.appointment_id}, 'Confirmed')">Confirm</button>` : ''}
            ${['Pending', 'Confirmed'].includes(a.status) ? `<button class="btn btn-sm" onclick="setStatus(${a.appointment_id}, 'Done')">Done</button>
              <button class="btn btn-sm btn-danger" onclick="cancelAppt(${a.appointment_id})">Cancel</button>` : ''}
          </td>
        </tr>`).join('');
    }

    async function setStatus(id, status) {
      try {
        await api('PATCH', `/appointments/${id}/status`, { status });
        showMsg(`Appointment marked ${status}.`);
        await load();
      } catch (err) { showError(err); }
    }

    async function cancelAppt(id) {
      if (!confirm('Cancel this appointment? The time slot will open up again.')) return;
      try {
        await api('PATCH', `/appointments/${id}/cancel`);
        showMsg('Appointment cancelled.');
        await load();
      } catch (err) { showError(err); }
    }

    if (user) {
      $('filter').addEventListener('change', () => load().catch(showError));
      load().catch(showError);
    }
  </script>
</body>
</html>
