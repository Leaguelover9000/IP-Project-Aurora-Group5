<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Dentists - Aurora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main class="container">
    <h1>Dentists</h1>
    <p class="subtitle">Add, edit or remove dentists. Each dentist gets a login account.</p>
    <div id="msg"></div>

    <div class="card">
      <h2 id="form-title">Add dentist</h2>
      <form id="form">
        <div class="row">
          <div class="field"><label>Full name</label><input id="name" placeholder="Dr. Maria Santos" required></div>
          <div class="field"><label>Specialization</label><input id="spec" placeholder="General Dentistry"></div>
          <div class="field"><label>Email (login)</label><input type="email" id="email" required></div>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="field"><label>Phone</label><input id="phone"></div>
          <div class="field"><label id="pw-label">Password</label><input type="password" id="password" minlength="6"></div>
          <div class="field" style="flex:2 1 260px;flex-direction:row;gap:8px;align-items:flex-end">
            <button class="btn btn-primary" id="save-btn">Add dentist</button>
            <button type="button" class="btn" id="cancel-btn" hidden>Cancel edit</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Specialization</th><th>Email</th><th>Phone</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>No dentists yet.</div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const user = initPage(['admin']);
    const $ = (id) => document.getElementById(id);
    let dentists = [];
    let editingId = null;

    async function load() {
      dentists = await api('GET', '/dentists');
      $('empty').hidden = dentists.length > 0;
      $('rows').innerHTML = dentists.map((d) => `
        <tr>
          <td>${esc(d.name)}</td><td>${esc(d.specialization)}</td>
          <td>${esc(d.email)}</td><td>${esc(d.phone || '-')}</td>
          <td class="actions">
            <button class="btn btn-sm" onclick="startEdit(${d.dentist_id})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="remove(${d.dentist_id})">Delete</button>
          </td>
        </tr>`).join('');
    }

    function startEdit(id) {
      const d = dentists.find((x) => x.dentist_id === id);
      editingId = id;
      $('name').value = d.name;
      $('spec').value = d.specialization;
      $('email').value = d.email;
      $('phone').value = d.phone || '';
      $('password').value = '';
      $('password').required = false;
      $('pw-label').textContent = 'New password (leave empty to keep)';
      $('form-title').textContent = 'Edit dentist';
      $('save-btn').textContent = 'Save changes';
      $('cancel-btn').hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      editingId = null;
      $('form').reset();
      $('password').required = true;
      $('pw-label').textContent = 'Password';
      $('form-title').textContent = 'Add dentist';
      $('save-btn').textContent = 'Add dentist';
      $('cancel-btn').hidden = true;
    }

    async function remove(id) {
      if (!confirm('Delete this dentist and all of their slots?')) return;
      try {
        await api('DELETE', `/dentists/${id}`);
        showMsg('Dentist deleted.');
        if (editingId === id) resetForm();
        await load();
      } catch (err) { showError(err); }
    }

    if (user) {
      resetForm();
      $('cancel-btn').addEventListener('click', resetForm);
      $('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
          name: $('name').value, specialization: $('spec').value, email: $('email').value,
          phone: $('phone').value, password: $('password').value || undefined,
        };
        try {
          if (editingId) await api('PUT', `/dentists/${editingId}`, body);
          else await api('POST', '/dentists', body);
          showMsg(editingId ? 'Dentist updated.' : 'Dentist added.');
          resetForm();
          await load();
        } catch (err) { showError(err); }
      });
      load().catch(showError);
    }
  </script>
</body>
</html>
